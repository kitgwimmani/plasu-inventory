# PLASU SMIS - nginx site config
# Serves the built React app and reverse-proxies the API to the Node service.
#
# Install: copy to /etc/nginx/sites-available/plasu-smis and symlink into
#          /etc/nginx/sites-enabled/ (deploy/setup.sh does this).

server {
    listen 80;
    listen [::]:80;
    server_name 80.241.214.47;

    # Built React bundle
    root /opt/plasu-smis/client/build;
    index index.html;

    # Allow DB backup downloads and larger requisition payloads
    client_max_body_size 25m;

    # Static assets - long cache, hashed filenames
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API -> Node
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Server-hosted assets (e.g. /public/logo.png used on printed letterheads)
    location /public/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback - every other route is handled by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- HTTPS later -----------------------------------------------------------
    # Point an A record at this server, then run:
    #   sudo apt install certbot python3-certbot-nginx
    #   sudo certbot --nginx -d your-domain.edu.ng
    # certbot rewrites this file to add the :443 block and a redirect.
    # Remember to update CLIENT_ORIGIN in server/.env to the https:// URL.
}
